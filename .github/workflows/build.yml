name: Desktop build and release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag
        required: false
        type: string

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libclang-dev libspeechd-dev libasound2-dev libfontconfig-dev libpipewire-0.3-dev libwayland-dev libxrandr-dev libdbus-1-dev libegl-dev libgbm-dev libxcb-shape0-dev libxcb-xfixes0-dev netcat-openbsd xvfb
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: ./scripts/verify-pc-issues.sh
      - run: ./scripts/stress-pc-io.sh
      - run: ./scripts/test-source-package.sh
      - run: ./scripts/smoke-linux.sh

  build-windows:
    name: Windows package and smoke test
    needs: check
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test visible assistant controls
        run: cargo test -p ale-gui visible_assistant_controls_reach_root_callbacks --locked
      - run: ./scripts/package-windows.sh
      - name: Smoke-test Windows package
        shell: pwsh
        run: ./scripts/test-windows-package.ps1
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        with:
          name: ale-my-eyes-windows
          path: ale-my-eyes-windows.zip

  build-linux:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libclang-dev libspeechd-dev libasound2-dev libfontconfig-dev libpipewire-0.3-dev libwayland-dev libxrandr-dev libdbus-1-dev libegl-dev libgbm-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: ./scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        with:
          name: ale-my-eyes-linux
          path: ale-my-eyes-linux.tar.gz

  nix:
    name: Nix package and module
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix flake check --all-systems --no-build
      - run: nix build .#packages.x86_64-linux.default

  source-package:
    name: Source package
    needs: check
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libclang-dev libspeechd-dev libasound2-dev libfontconfig-dev libpipewire-0.3-dev libwayland-dev libxrandr-dev libdbus-1-dev libegl-dev libgbm-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: ./scripts/test-source-package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ale-my-eyes-source
          path: release/*.tar.gz

  release:
    needs: [build-windows, build-linux, nix, source-package]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && (inputs.release_tag || format('manual-{0}', github.run_number)) || github.ref_name }}
          files: |
            artifacts/ale-my-eyes-windows/ale-my-eyes-windows.zip
            artifacts/ale-my-eyes-linux/ale-my-eyes-linux.tar.gz
            artifacts/ale-my-eyes-source/*.tar.gz
