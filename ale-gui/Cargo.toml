[package]
name = "ale-gui"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
ale-core = { path = "../ale-core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3"
image = "0.25"
tracing = "0.1"
anyhow = "1"
base64 = "0.22"
futures-util = "0.3"
rand = "0.8"
sha2 = "0.10"
dirs = "5"
snow = "0.9"
tokio-tungstenite = "0.24"
uuid = { version = "1", features = ["v4", "serde"] }

slint = "1.16"
cpal = "0.15"
rodio = "0.19"
rfd = "0.15"
xcap = "0.9"
enigo = "0.6"
open = "5"
local-ip-address = "0.6"
qrcode = "0.14"

[[bin]]
name = "ale-gui"
path = "src/main.rs"

[build-dependencies]
slint-build = "1.16"

[dev-dependencies]
quircs = "0.10.3"
