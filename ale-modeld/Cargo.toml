[package]
name = "ale-modeld"
version = "0.1.0"
edition = "2021"
description = "Application-managed model scheduler for Ale, My Eyes!"
license = "MIT"

[dependencies]
ale-core = { path = "../ale-core" }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
prost = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
hound = "3"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { workspace = true }

[target.'cfg(not(all(target_os = "windows", target_env = "gnu")))'.dependencies]
sherpa-rs = { version = "0.6.8", default-features = false, features = ["download-binaries"], optional = true }

[features]
default = ["sensevoice"]
sensevoice = ["dep:sherpa-rs"]

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "ale-modeld"
path = "src/main.rs"
