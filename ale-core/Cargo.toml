[package]
name = "ale-core"
version = "0.1.0"
edition = "2021"
description = "Core functionality for Ale, My Eyes! - config, cloud model calls, scheduling and task harness"
license = "MIT"

[lib]
crate-type = ["rlib"]

[dependencies]
image = "0.25"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
prost = { workspace = true }
sha2 = "0.10"
tar = "0.4"
bzip2 = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
futures = "0.3"
url = "2"
dirs = "5"
urlencoding = "2"
keyring = "4.1"
jsonschema = { version = "0.33", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
